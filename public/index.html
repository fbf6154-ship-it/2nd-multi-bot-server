<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Bot Hosting & Live Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

<div class="max-w-4xl mx-auto space-y-6">

    <!-- Top Header -->
    <div class="flex items-center justify-between bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg">
        <div>
            <h1 class="text-2xl font-bold text-sky-400 flex items-center gap-2">
                <i class="fa-solid fa-robot"></i> 24/7 বট হোস্টিং ও লাইভ এডিটর
            </h1>
            <p class="text-xs text-slate-400 mt-1">রানিং বটের কোড ও টোকেন যেকোনো সময় লাইভ এডিট করুন</p>
        </div>
        <div class="flex items-center gap-2 bg-emerald-950 text-emerald-400 px-3 py-1.5 rounded-full text-xs font-semibold border border-emerald-800">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> সার্ভার অনলাইন
        </div>
    </div>

    <div class="grid md:grid-cols-2 gap-6">

        <!-- Upload Box -->
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg">
            <h2 class="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-cloud-arrow-up text-sky-400"></i> নতুন বট হোস্ট করুন
            </h2>

            <form id="uploadForm" class="space-y-4">
                <div>
                    <label class="text-xs font-medium text-slate-300">বটের নাম</label>
                    <input type="text" id="botName" placeholder="যেমন: OTP Guru Bot" required
                           class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-sky-500">
                </div>

                <div>
                    <label class="text-xs font-medium text-slate-300">বট API টোকেন</label>
                    <input type="text" id="botToken" placeholder="BotFather থেকে পাওয়া টোকেন দিন" required
                           class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-sky-500">
                </div>

                <div>
                    <label class="text-xs font-medium text-slate-300">বটের ফাইল (.py অথবা .js)</label>
                    <input type="file" id="botFile" accept=".py, .js"
                           class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm file:mr-3 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:bg-sky-600 file:text-white hover:file:bg-sky-500">
                </div>

                <div class="text-center text-xs text-slate-500 font-semibold">— অথবা নিচে কোড পেস্ট করুন —</div>

                <div class="flex gap-4 text-xs text-slate-300">
                    <label class="flex items-center gap-1 cursor-pointer">
                        <input type="radio" name="codeType" value="python" checked> Python (.py)
                    </label>
                    <label class="flex items-center gap-1 cursor-pointer">
                        <input type="radio" name="codeType" value="javascript"> Node.js (.js)
                    </label>
                </div>

                <div>
                    <textarea id="botCode" rows="4" placeholder="# এখানে পাইথন বা জাভাস্ক্রিপ্ট কোড পেস্ট করতে পারেন..."
                              class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs font-mono focus:outline-none focus:border-sky-500"></textarea>
                </div>

                <button type="submit" id="submitBtn"
                        class="w-full bg-sky-500 hover:bg-sky-600 text-slate-900 font-bold py-2.5 rounded-lg text-sm transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-play"></i> হোস্ট ও রান করুন
                </button>
            </form>
        </div>

        <!-- Running Bots List -->
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg">
            <h2 class="text-lg font-bold text-slate-200 mb-4 flex items-center justify-between">
                <span class="flex items-center gap-2"><i class="fa-solid fa-server text-emerald-400"></i> চলমান বটসমূহ</span>
                <span id="botCount" class="text-xs bg-slate-700 px-2 py-1 rounded-md text-slate-300">0</span>
            </h2>

            <div id="botsContainer" class="space-y-3 max-h-[420px] overflow-y-auto pr-1">
                <p class="text-xs text-slate-500 text-center py-8">লোড হচ্ছে...</p>
            </div>
        </div>

    </div>
</div>

<!-- লাইভ কোড এডিটর মোডাল (POPUP) -->
<div id="editModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-2xl max-h-[90vh] flex flex-col shadow-2xl">
        <div class="p-4 border-b border-slate-700 flex justify-between items-center">
            <h3 class="font-bold text-sky-400 flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square"></i> বটের কোড ও টোকেন এডিটর
            </h3>
            <button onclick="closeEditModal()" class="text-slate-400 hover:text-white text-lg">✕</button>
        </div>

        <form id="editForm" class="p-4 overflow-y-auto space-y-4 flex-1">
            <input type="hidden" id="editBotId">

            <div>
                <label class="text-xs font-semibold text-slate-300">বটের নাম</label>
                <input type="text" id="editBotName" required
                       class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500">
            </div>

            <div>
                <label class="text-xs font-semibold text-slate-300">বট API টোকেন</label>
                <input type="text" id="editBotToken" required
                       class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500">
            </div>

            <div>
                <label class="text-xs font-semibold text-slate-300 flex justify-between">
                    <span>বটের সম্পূর্ণ কোড (Live Code Editor)</span>
                    <span id="editBotFilename" class="text-[10px] text-sky-400 font-mono"></span>
                </label>
                <textarea id="editBotCode" rows="14" required
                          class="w-full mt-1 bg-slate-950 border border-slate-700 rounded-lg p-3 text-xs font-mono text-emerald-400 focus:outline-none focus:border-sky-500 leading-relaxed"></textarea>
            </div>

            <div class="flex gap-3 pt-2">
                <button type="submit" id="saveEditBtn"
                        class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold py-2.5 rounded-lg text-sm transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> পরিবর্তন সেভ ও রিস্টার্ট করুন
                </button>
                <button type="button" onclick="closeEditModal()"
                        class="px-4 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-semibold">
                    বাতিল
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    async function loadBots() {
        const res = await fetch('/api/bots');
        const bots = await res.json();
        const container = document.getElementById('botsContainer');
        document.getElementById('botCount').innerText = bots.length;

        if (bots.length === 0) {
            container.innerHTML = '<p class="text-xs text-slate-500 text-center py-8">এখনো কোনো বট চালু নেই।</p>';
            return;
        }

        container.innerHTML = bots.map(b => `
            <div class="bg-slate-900 p-3.5 rounded-xl border border-slate-700/60 flex items-center justify-between">
                <div>
                    <div class="font-bold text-sm text-slate-100 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-400"></span> ${b.name}
                        <span class="text-[10px] bg-slate-800 border border-slate-700 text-sky-400 px-1.5 py-0.5 rounded font-mono">${b.type}</span>
                    </div>
                    <div class="text-[11px] text-slate-400 mt-0.5">${b.createdAt}</div>
                </div>
                <div class="flex items-center gap-1">
                    <button onclick="openEditModal('${b.id}')" class="text-sky-400 hover:text-sky-300 p-2 text-sm" title="কোড ও টোকেন এডিট করুন">
                        <i class="fa-solid fa-pen-to-square"></i>
                    </button>
                    <button onclick="deleteBot('${b.id}')" class="text-rose-400 hover:text-rose-300 p-2 text-sm" title="ডিলিট করুন">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            </div>
        `).join('');
    }

    // নতুন বট আপলোড
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> আপলোড হচ্ছে...';

        const formData = new FormData();
        formData.append('botName', document.getElementById('botName').value);
        formData.append('botToken', document.getElementById('botToken').value);
        
        const file = document.getElementById('botFile').files[0];
        if (file) formData.append('botFile', file);
        formData.append('botCode', document.getElementById('botCode').value);
        formData.append('codeType', document.querySelector('input[name="codeType"]:checked').value);

        const res = await fetch('/api/upload', { method: 'POST', body: formData });
        const result = await res.json();

        if (result.success) {
            alert(result.message);
            document.getElementById('uploadForm').reset();
            loadBots();
        } else {
            alert(result.error || 'সমস্যা হয়েছে!');
        }

        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-play"></i> হোস্ট ও রান করুন';
    });

    // এডিট মোডাল ওপেন
    async function openEditModal(id) {
        const res = await fetch('/api/bots/' + id);
        const bot = await res.json();

        if (bot.error) {
            alert(bot.error);
            return;
        }

        document.getElementById('editBotId').value = bot.id;
        document.getElementById('editBotName').value = bot.name;
        document.getElementById('editBotToken').value = bot.token;
        document.getElementById('editBotFilename').innerText = bot.filename;
        document.getElementById('editBotCode').value = bot.code;

        document.getElementById('editModal').classList.remove('hidden');
        document.getElementById('editModal').classList.add('flex');
    }

    function closeEditModal() {
        document.getElementById('editModal').classList.add('hidden');
        document.getElementById('editModal').classList.remove('flex');
    }

    // এডিট সেভ হ্যান্ডলার
    document.getElementById('editForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('editBotId').value;
        const btn = document.getElementById('saveEditBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> সেভ হচ্ছে...';

        const payload = {
            botName: document.getElementById('editBotName').value,
            botToken: document.getElementById('editBotToken').value,
            botCode: document.getElementById('editBotCode').value
        };

        const res = await fetch('/api/bots/' + id + '/edit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.success) {
            alert(result.message);
            closeEditModal();
            loadBots();
        } else {
            alert(result.error || 'সমস্যা হয়েছে!');
        }

        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> পরিবর্তন সেভ ও রিস্টার্ট করুন';
    });

    // বট ডিলিট
    async function deleteBot(id) {
        if (!confirm('আপনি কি এই বটটি বন্ধ ও ডিলিট করতে চান?')) return;
        await fetch('/api/bots/' + id, { method: 'DELETE' });
        loadBots();
    }

    loadBots();
    setInterval(loadBots, 10000);
</script>

</body>
</html>
